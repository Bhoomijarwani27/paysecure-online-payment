<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Set UPI PIN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="paysecure-universal.css?v=2">
  <style>
    .card { max-width:480px; margin:40px auto; padding:24px; border-radius:12px; }
    .pin-row { display:flex; gap:10px; justify-content:center; margin-bottom:16px; }
    /* Use tel inputs and webkit-text-security to mask digits so browser doesn't add its own reveal icon */
    .pin-box {
      width:56px; height:56px; font-size:20px; text-align:center; border-radius:10px; border:2px solid #eee;
      -webkit-text-security: disc; /* masks characters on WebKit browsers */
      /* text-security (non-standard) removed to avoid lint errors; browsers without -webkit-text-security will display digits normally */
    }
    /* When visible, remove the masking */
    .pin-box.visible {
      -webkit-text-security: none;
      /* text-security (non-standard) removed to avoid lint errors; browsers without -webkit-text-security will display digits normally */
    }

    /* Hide browser clear/reveal buttons (Edge/IE) */
    input::-ms-clear, input::-ms-reveal { display: none; width: 0; height: 0; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="header">
      <div class="logo"><i class="fa-solid fa-lock"></i><span class="pay">pay</span><span class="secure">secure</span></div>
      <div class="help-link-header"><a href="help.html" class="help-text">Help?</a></div>
    </div>

    <div class="page-card card">
      <h2 class="page-title">Set your UPI PIN</h2>
      <p class="subtitle">Set your 4-digit UPI PIN to secure payments</p>

      <form id="upiForm" action="set_upi_pin.php" method="post">
        <input type="hidden" name="pin_length" value="4">

        <div class="form-group">
          <label class="form-label">Enter PIN</label>
          <div style="display:flex; align-items:center; gap:8px; justify-content:center;">
            <div class="pin-row" id="upiPinRow">
              <!-- Inputs will be generated by JS according to selected length -->
            </div>
            <button type="button" id="toggleUpiVisibility" title="Show / hide PIN" style="background:#fff;border:1px solid #e6eefb;border-radius:8px;padding:8px;cursor:pointer;">
              <i id="toggleUpiIcon" class="fa-regular fa-eye"></i>
            </button>
          </div>
          <input type="hidden" name="upi_pin" id="upi_pin" />
          <input type="hidden" name="confirm_upi_pin" id="confirm_upi_pin" />
        </div>

        <button class="btn-primary" type="submit" style="width:100%">Set UPI PIN</button>
      </form>
    </div>
  </div>

  <script>
    const upiPinRow = document.getElementById('upiPinRow');

    function renderPinInputs(len) {
      upiPinRow.innerHTML = '';
      for (let i = 0; i < len; i++) {
        const inp = document.createElement('input');
        // use type=tel (no browser reveal icon) and mask via CSS -webkit-text-security
        inp.type = 'tel';
        inp.autocomplete = 'off';
        inp.spellcheck = false;
        inp.maxLength = 1;
        inp.className = 'pin-box';
        inp.inputMode = 'numeric';
        inp.pattern = '\\d';
        upiPinRow.appendChild(inp);

        inp.addEventListener('input', (e) => {
          inp.value = inp.value.replace(/\D/g, '');
          const next = inp.nextElementSibling;
          if (next) next.focus();
        });
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && inp.value === '') {
            const prev = inp.previousElementSibling;
            if (prev) prev.focus();
          }
        });
      }
      upiPinRow.querySelector('input')?.focus();
    }

    // Show/hide toggle
    const toggleBtn = document.getElementById('toggleUpiVisibility');
    const toggleIcon = document.getElementById('toggleUpiIcon');
    let pinVisible = false;

    function setPinVisibility(visible) {
      const inputs = upiPinRow.querySelectorAll('input');
      inputs.forEach(i => {
        if (visible) i.classList.add('visible'); else i.classList.remove('visible');
      });
      pinVisible = visible;
      if (visible) {
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
      toggleBtn.setAttribute('aria-pressed', visible ? 'true' : 'false');
    }

    toggleBtn.addEventListener('click', function(){
      setPinVisibility(!pinVisible);
      // ensure focus doesn't leave inputs
      upiPinRow.querySelector('input')?.focus();
    });

    // Always render 4 PIN inputs
    renderPinInputs(4);

    document.getElementById('upiForm').addEventListener('submit', function(e){
      // collect PINs
      const inputs = upiPinRow.querySelectorAll('input');
      let pin = '';
      for (let i = 0; i < inputs.length; i++) {
        if (!/^[0-9]$/.test(inputs[i].value)) {
          e.preventDefault();
          alert('Please enter all digits of the UPI PIN');
          inputs[i].focus();
          return false;
        }
        pin += inputs[i].value;
      }
      document.getElementById('upi_pin').value = pin;
      document.getElementById('confirm_upi_pin').value = pin;
      return true; // allow form to submit to set_upi_pin.php
    });
  </script>
</body>
</html>
