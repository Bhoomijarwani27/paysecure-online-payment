    <script src="receipt_utils.js"></script>
    <script>
        // Global variables
        let selectedBillType = '';
        let currentBillAmount = 0;
        let selectedProvider = '';

        // Bill providers data
        const billProviders = {
            electricity: ['MSEB', 'TSSPDCL', 'BESCOM', 'WBSEDCL', 'UPPCL'],
            water: ['MCGM', 'DJB', 'BWSSB', 'HMWSSB', 'KMC'],
            gas: ['Indane Gas', 'Bharat Gas', 'HP Gas', 'Adani Gas', 'Gujarat Gas'],
            internet: ['Airtel Broadband', 'Jio Fiber', 'BSNL', 'Tata Sky', 'Dish TV'],
            mobile: ['Airtel Postpaid', 'Jio Postpaid', 'Vi Postpaid', 'BSNL Postpaid'],
            insurance: ['LIC', 'HDFC Life', 'ICICI Prudential', 'SBI Life', 'Max Life']
        };

        function selectBillType(billType) {
            selectedBillType = billType;
            document.getElementById('billCategories').style.display = 'none';
            document.getElementById('billForm').classList.add('visible');

            const titles = {
                electricity: 'Electricity Bill',
                water: 'Water Bill',
                gas: 'Gas Bill',
                internet: 'Internet/DTH',
                mobile: 'Mobile Postpaid',
                insurance: 'Insurance Premium'
            };

            document.getElementById('selectedBillTitle').textContent = titles[billType];

            const select = document.getElementById('serviceProvider');
            select.innerHTML = '<option value="">Select provider...</option>';
            billProviders[billType].forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                select.appendChild(opt);
            });
        }

        function goBack() {
            document.getElementById('billForm').classList.remove('visible');
            document.getElementById('billCategories').style.display = 'grid';
            document.getElementById('paymentForm').reset();
            document.getElementById('billInfo').classList.remove('visible');
        }

        function updateBillInfo() {
            selectedProvider = document.getElementById('serviceProvider').value;
        }

        function fetchBillAmount() {
            const acc = document.getElementById('accountNumber').value;
            const name = document.getElementById('customerName').value;

            if (!selectedProvider || !acc) return;

            // Simulate fetch
            currentBillAmount = Math.floor(Math.random() * 2000) + 100;

            document.getElementById('billCustomer').textContent = 'Customer: ' + (name || 'Valued Customer');
            document.getElementById('billDueDate').textContent = 'Due Date: ' + new Date().toLocaleDateString();
            document.getElementById('billStatus').textContent = 'Status: Pending';
            document.getElementById('billAmount').textContent = '₹' + currentBillAmount.toFixed(2);
            document.getElementById('paymentAmount').value = currentBillAmount;

            document.getElementById('billInfo').classList.add('visible');
        }

        function proceedToPayment() {
            if (!currentBillAmount) {
                alert('Please fetch bill details first');
                return;
            }

            document.getElementById('pinModalAmount').textContent = 'Paying ₹' + currentBillAmount.toFixed(2);
            document.getElementById('upiPinModal').style.display = 'flex';
            document.getElementById('upiPinInput').value = '';
            document.getElementById('upiPinInput').focus();
        }

        function closeUpiPinModal() {
            document.getElementById('upiPinModal').style.display = 'none';
        }

        function processBillPayment() {
            const pin = document.getElementById('upiPinInput').value;
            if (pin.length < 4) {
                alert('Invalid PIN');
                return;
            }

            const payload = {
                bill_type: selectedBillType,
                provider: selectedProvider,
                account_number: document.getElementById('accountNumber').value,
                customer_name: document.getElementById('customerName').value,
                amount: currentBillAmount,
                upi_pin: pin
            };

            fetch('process_bill_payment.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(r => r.json())
                .then(data => {
                    closeUpiPinModal();
                    if (data.success) {
                        // Use shared receipt utility
                        if (window.showReceipt) {
                            window.showReceipt({
                                success: true,
                                amount: data.amount || currentBillAmount,
                                transaction_id: data.transaction_id,
                                date: new Date().toLocaleString(),
                                recipient: selectedProvider,
                                type: 'Bill Payment',
                                new_balance: data.new_balance
                            });
                        } else {
                            alert('Payment Successful! TXN: ' + data.transaction_id);
                            window.location.reload();
                        }
                    } else {
                        alert('Failed: ' + (data.error || data.message));
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('Error processing payment');
                    closeUpiPinModal();
                });
        }
    </script>
