          <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
          <script src="receipt_utils.js"></script>
          <script>
            function handlePhotoUpload(event) {
              const file = event.target.files[0];
              const statusDiv = document.getElementById('uploadStatus');

              if (!file) return;

              statusDiv.style.display = 'block';
              statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning QR code...';
              statusDiv.style.color = '#1976D2';

              const reader = new FileReader();
              reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                  const canvas = document.createElement('canvas');
                  const ctx = canvas.getContext('2d');
                  canvas.width = img.width;
                  canvas.height = img.height;
                  ctx.drawImage(img, 0, 0);
                  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                  const code = jsQR(imageData.data, imageData.width, imageData.height);

                  if (code) {
                    statusDiv.innerHTML = '✅ QR Code Found!';
                    statusDiv.style.color = 'green';
                    extractPaymentInfo(code.data);
                  } else {
                    statusDiv.innerHTML = '❌ No QR code found. Please enter details manually.';
                    statusDiv.style.color = 'red';
                    document.getElementById('paymentForm').style.display = 'block';
                    // Show manual input if scan fails
                    document.getElementById('merchantPhone').style.display = 'block';
                    document.getElementById('merchantDisplay').style.display = 'none';
                  }
                };
                img.src = e.target.result;
              };
              reader.readAsDataURL(file);
            }

            function extractPaymentInfo(qrData) {
              console.log('QR Data:', qrData);
              let phone = '';
              let vpa = '';

              if (qrData.includes('pa=')) {
                const urlParams = new URLSearchParams(qrData.split('?')[1]);
                vpa = urlParams.get('pa') || '';

                if (vpa && vpa.includes('@')) {
                  const vpaParts = vpa.split('@');
                  if (vpaParts[0].match(/^\d{10}$/)) {
                    phone = vpaParts[0];
                  }
                }
              }

              if (!phone) {
                const matches = qrData.match(/\d{10}/g);
                if (matches && matches.length > 0) {
                  phone = matches[0];
                }
              }

              // Set hidden input value
              document.getElementById('merchantPhone').value = phone;

              if (phone) {
                // Phone found: Show display text and hide input
                document.getElementById('displayPhone').textContent = phone;
                document.getElementById('merchantDisplay').style.display = 'block';
                document.getElementById('merchantPhone').style.display = 'none';
              } else {
                // Phone NOT found: Show manual input and hide display text
                document.getElementById('merchantDisplay').style.display = 'none';
                document.getElementById('merchantPhone').style.display = 'block';
                alert('Could not detect phone number from QR. Please enter it manually.');
              }

              document.getElementById('paymentForm').style.display = 'block';
              if (phone) {
                document.getElementById('amount').focus();
              } else {
                document.getElementById('merchantPhone').focus();
              }
            }

            function processPayment() {
              const phone = document.getElementById('merchantPhone').value;
              const amount = document.getElementById('amount').value;
              const note = document.getElementById('note').value || 'Payment';

              if (!phone || phone.length !== 10) {
                alert('Please enter a valid 10-digit phone number');
                // Show input if validation fails so user can correct it
                document.getElementById('merchantPhone').style.display = 'block';
                document.getElementById('merchantDisplay').style.display = 'none';
                return;
              }

              if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
              }

              const pin = prompt('Enter your UPI PIN:');
              if (!pin) return;

              fetch('process_send_money.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  counterparty_phone: phone,
                  amount: amount,
                  note: note,
                  pin: pin
                })
              })
                .then(res => res.json())
                .then(data => {
                  if (data.success) {
                    // Show receipt instead of redirecting immediately
                    showReceipt({
                      success: true,
                      amount: amount,
                      transaction_id: data.transaction_id,
                      recipient: data.recipient_name || phone, // Use name from response or fallback to phone
                      date: new Date().toLocaleString()
                    });
                  } else {
                    alert('❌ Payment Failed: ' + (data.error || data.message));
                  }
                })
                .catch(err => {
                  alert('Network Error: ' + err.message);
                });
            }
          </script>
