<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Recharge History - PaySecure</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Match Homepage Styling */
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #42A5F5 0%, #1976D2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .page-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(25, 118, 210, 0.15);
            margin-bottom: 24px;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin: 0 0 30px 0;
        }

        /* Filter controls */
        .filter-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 10px 16px;
            border-radius: 10px;
            border: 2px solid #f0f0f0;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:focus {
            border-color: #1d9bf0;
            outline: none;
        }

        /* Transaction list */
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction-item {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #9C27B0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .transaction-item:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-1px);
        }

        .transaction-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-title {
            font-weight: 700;
            font-size: 16px;
            color: #333;
            margin-bottom: 4px;
        }

        .transaction-details {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .transaction-meta {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #999;
        }

        .transaction-amount {
            font-size: 18px;
            font-weight: 700;
            color: #d32f2f;
        }

        .transaction-date {
            font-size: 12px;
            color: #999;
            text-align: right;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 64px;
            color: #ddd;
            margin-bottom: 20px;
        }

        /* Back button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            margin-bottom: 16px;
            font-weight: 600;
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            opacity: 1;
            transform: translateX(-2px);
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Status badges */
        .status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-completed {
            background: #e8f5e8;
            color: #2e7d32;
        }

        .status-pending {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-failed {
            background: #ffebee;
            color: #d32f2f;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .transaction-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .transaction-amount {
                margin-top: 8px;
            }

            .filter-controls {
                flex-direction: column;
            }

            .filter-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Back link -->
        <a href="homepage_v1.php" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

        <!-- Main content card -->
        <div class="page-card">
            <h1 class="page-title">
                <i class="fas fa-mobile-alt" style="color: #9C27B0;"></i>
                Mobile Recharge History
            </h1>

            <!-- Filter controls -->
            <div class="filter-controls">
                <select id="operatorFilter" class="filter-select">
                    <option value="">All Operators</option>
                    <option value="airtel">Airtel</option>
                    <option value="jio">Jio</option>
                    <option value="vi">Vi</option>
                    <option value="bsnl">BSNL</option>
                    <option value="idea">Idea</option>
                </select>

                <select id="periodFilter" class="filter-select">
                    <option value="30">Last 30 days</option>
                    <option value="90">Last 3 months</option>
                    <option value="365">Last year</option>
                    <option value="">All time</option>
                </select>

                <select id="statusFilter" class="filter-select">
                    <option value="">All Status</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                    <option value="failed">Failed</option>
                </select>
            </div>

            <!-- Transaction list -->
            <div id="transactionList" class="transaction-list">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <div>Loading recharge history...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allTransactions = [];

        // Load transaction history on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadRechargeHistory();
            
            // Add event listeners for filters
            document.getElementById('operatorFilter').addEventListener('change', applyFilters);
            document.getElementById('periodFilter').addEventListener('change', applyFilters);
            document.getElementById('statusFilter').addEventListener('change', applyFilters);
        });

        function loadRechargeHistory() {
            fetch('get_recharge_history.php', {
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                console.log('Recharge history loaded:', data);
                
                if (data.success) {
                    allTransactions = data.transactions || [];
                    displayTransactions(allTransactions);
                } else {
                    showError('Failed to load history: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error loading recharge history:', error);
                showError('Network error: ' + error.message);
            });
        }

        function displayTransactions(transactions) {
            const listContainer = document.getElementById('transactionList');
            
            if (!transactions || transactions.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-mobile-alt"></i>
                        <h3>No Recharges Found</h3>
                        <p>You haven't made any mobile recharges yet.</p>
                        <a href="homepage_v1.php" style="color: #1d9bf0; text-decoration: none; font-weight: 600;">
                            Make your first recharge →
                        </a>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = transactions.map(tx => {
                const operatorIcon = getOperatorIcon(tx.operator);
                
                return `
                    <div class="transaction-item">
                        <div class="transaction-header">
                            <div class="transaction-info">
                                <div class="transaction-title">
                                    <i class="${operatorIcon}" style="margin-right: 8px; color: #9C27B0;"></i>
                                    Mobile Recharge - ${tx.operator || 'Unknown Operator'}
                                </div>
                                <div class="transaction-details">
                                    ${tx.mobile_number ? `${tx.country_code || ''} ${tx.mobile_number}` : 'Mobile recharge transaction'}
                                    ${tx.description ? `<br><small>${tx.description}</small>` : ''}
                                </div>
                                <div class="transaction-meta">
                                    <span><i class="fas fa-calendar"></i> ${formatDate(tx.created_at)}</span>
                                    <span><i class="fas fa-receipt"></i> ${tx.transaction_id}</span>
                                    <span class="status status-${tx.status}"><i class="fas fa-circle"></i> ${tx.status}</span>
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div class="transaction-amount">
                                    -₹${Math.abs(parseFloat(tx.amount)).toFixed(2)}
                                </div>
                                <div class="transaction-date">
                                    ${formatTime(tx.created_at)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getOperatorIcon(operator) {
            const icons = {
                airtel: 'fas fa-signal',
                jio: 'fas fa-wifi',
                vi: 'fas fa-mobile-alt',
                bsnl: 'fas fa-broadcast-tower',
                idea: 'fas fa-satellite'
            };
            return icons[operator?.toLowerCase()] || 'fas fa-mobile-alt';
        }

        function applyFilters() {
            const operatorFilter = document.getElementById('operatorFilter').value;
            const periodFilter = document.getElementById('periodFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            
            let filteredTransactions = [...allTransactions];
            
            // Apply operator filter
            if (operatorFilter) {
                filteredTransactions = filteredTransactions.filter(tx => 
                    tx.operator?.toLowerCase() === operatorFilter.toLowerCase()
                );
            }
            
            // Apply period filter
            if (periodFilter) {
                const cutoffDate = new Date();
                cutoffDate.setDate(cutoffDate.getDate() - parseInt(periodFilter));
                
                filteredTransactions = filteredTransactions.filter(tx => 
                    new Date(tx.created_at) >= cutoffDate
                );
            }
            
            // Apply status filter
            if (statusFilter) {
                filteredTransactions = filteredTransactions.filter(tx => 
                    tx.status === statusFilter
                );
            }
            
            displayTransactions(filteredTransactions);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-IN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showError(message) {
            const listContainer = document.getElementById('transactionList');
            listContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color: #f44336;"></i>
                    <h3>Error Loading History</h3>
                    <p>${message}</p>
                    <button onclick="loadRechargeHistory()" style="padding: 10px 20px; background: #1d9bf0; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 16px;">
                        Try Again
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
