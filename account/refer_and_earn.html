<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refer and Earn - PaySecure</title>
    <link rel="stylesheet" href="paysecure-universal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .icon {
            font-size: 64px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .code-box {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 24px;
            letter-spacing: 2px;
            margin: 20px 0;
            border: 2px dashed #ccc;
            color: #1d9bf0;
            font-weight: bold;
        }

        .btn {
            background: #1d9bf0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn:hover {
            background: #1578b9;
        }
    </style>
</head>

<body>
    <div class="container">
        <i class="fas fa-gift icon"></i>
        <h1>Referral Code Applied!</h1>
        <p>You have successfully scanned a referral code.</p>

        <div id="referralCode" class="code-box">LOADING...</div>

        <p style="color: #666; font-size: 14px;">Share this code with friends to earn rewards!</p>

        <a href="homepage_clean.php" class="btn">Go to Dashboard</a>
    </div>

    <script>
        // Extract code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            document.getElementById('referralCode').textContent = code;
        } else {
            document.getElementById('referralCode').textContent = 'NO CODE';
            document.getElementById('referralCode').style.color = '#ff4444';
        }
    </script>
</body>

</html>
