  <!-- Scripts -->
  <script src="receipt_utils.js"></script>

  <script>
    function onSendMoneyClick() {
      const phone = (document.getElementById('phone').value || '').replace(/\D/g, '');
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const note = (document.getElementById('note').value || '').trim();
      const cc = (document.getElementById('cc').value || '').trim();
      const msg = document.getElementById('formMsg');

      msg.innerHTML = '';

      if (phone.length !== 10) {
        msg.innerHTML = '<div style="color:#d32f2f;font-weight:600">Enter a valid 10-digit phone number.</div>';
        document.getElementById('phone').focus();
        return;
      }

      if (!(amount > 0)) {
        msg.innerHTML = '<div style="color:#d32f2f;font-weight:600">Enter a valid amount greater than 0.</div>';
        document.getElementById('amount').focus();
        return;
      }

      showUpiPinModal({ amount, phone, cc, note });
    }

    function showUpiPinModal(payload) {
      const modal = document.getElementById('upiPinModal');
      const pinInput = document.getElementById('upiPinInput');
      const confirmBtn = document.getElementById('upiPinConfirm');
      const cancelBtn = document.getElementById('upiPinCancel');
      const closeBtn = document.getElementById('upiPinClose');
      const msgEl = document.getElementById('upiPinMsg');

      pinInput.value = '';
      msgEl.innerHTML = '';
      modal.style.display = 'flex';
      pinInput.focus();

      function cleanup() {
        modal.style.display = 'none';
        confirmBtn.removeEventListener('click', onConfirm);
        cancelBtn.removeEventListener('click', onCancel);
        closeBtn.removeEventListener('click', onCancel);
      }

      function onCancel() {
        cleanup();
      }

      function onConfirm() {
        const pin = (pinInput.value || '').trim();

        if (pin.length < 4) {
          msgEl.innerHTML = '<div style="color:#d32f2f;font-weight:600">Enter a valid 4-digit UPI PIN.</div>';
          return;
        }

        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Processing...';
        msgEl.innerHTML = '<div style="color:#1d9bf0;font-weight:600">Authorizing transaction...</div>';

        fetch('process_send_money.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: payload.amount,
            counterparty_phone: payload.phone,
            counterparty_country: payload.cc,
            note: payload.note,
            pin: pin
          })
        }).then(r => r.json()).then(function (res) {
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Confirm & Pay';

          if (res && res.success) {
            msgEl.innerHTML = '<div style="color:#0b8043;font-weight:700">Payment Successful! ✓</div>';

            setTimeout(() => {
              cleanup();

              if (window.showReceipt) {
                window.showReceipt({
                  success: true,
                  amount: payload.amount,
                  transaction_id: res.transaction_id,
                  date: new Date().toLocaleString(),
                  recipient: payload.phone,
                  type: 'Money Transfer'
                });
              } else {
                alert('Payment Successful! TXN: ' + res.transaction_id);
                window.location.reload();
              }
            }, 1500);
          } else {
            msgEl.innerHTML = '<div style="color:#d32f2f;font-weight:600">' + (res.error || 'Payment failed') + '</div>';
          }
        }).catch(function (err) {
          console.error('send_payment error', err);
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Confirm & Pay';
          msgEl.innerHTML = '<div style="color:#d32f2f;font-weight:600">Network error. Please try again.</div>';
        });
      }

      confirmBtn.addEventListener('click', onConfirm);
      cancelBtn.addEventListener('click', onCancel);
      closeBtn.addEventListener('click', onCancel);
    }
  </script>
