<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refer & Earn - PaySecure</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #42A5F5 0%, #1976D2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(25, 118, 210, 0.15);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            font-weight: 700;
            font-size: 24px;
        }

        .back-btn {
            color: #1976D2;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Card */
        .referral-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .gift-icon {
            font-size: 80px;
            color: #FF9800;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            margin: 0 0 10px;
            color: #1976D2;
            font-size: 32px;
        }

        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Code Box */
        .code-box {
            background: #f5f9ff;
            border: 2px dashed #1976D2;
            border-radius: 16px;
            padding: 20px;
            margin: 0 auto 30px;
            max-width: 400px;
            position: relative;
        }

        .referral-code {
            font-size: 36px;
            font-weight: 800;
            color: #333;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        .copy-btn {
            background: #1976D2;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(25, 118, 210, 0.3);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
            border-top: 1px solid #eee;
            padding-top: 30px;
        }

        .stat-item {
            padding: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Share Buttons */
        .share-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .share-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            text-decoration: none;
            transition: transform 0.3s;
        }

        .share-btn:hover {
            transform: scale(1.1);
        }

        .whatsapp {
            background: #25D366;
        }

        .telegram {
            background: #0088cc;
        }

        .email {
            background: #EA4335;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <a href="homepage_clean.php" class="logo">
                <i class="fas fa-lock" style="color: #1976D2;"></i>
                <span>PaySecure</span>
            </a>
            <a href="homepage_clean.php" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="referral-card">
            <i class="fas fa-gift gift-icon"></i>
            <h1>Refer & Earn ₹50</h1>
            <p>Invite your friends to PaySecure. You both get ₹50 when they sign up using your code!</p>

            <div class="code-box">
                <span class="referral-code" id="myReferralCode">LOADING...</span>
                <button class="copy-btn" onclick="copyCode()">
                    <i class="fas fa-copy"></i> Copy Code
                </button>
            </div>

            <div class="share-actions">
                <a href="#" id="shareWhatsapp" class="share-btn whatsapp" target="_blank"><i
                        class="fab fa-whatsapp"></i></a>
                <a href="#" id="shareTelegram" class="share-btn telegram" target="_blank"><i
                        class="fab fa-telegram"></i></a>
                <a href="#" id="shareEmail" class="share-btn email"><i class="fas fa-envelope"></i></a>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalEarnings">₹0</div>
                    <div class="stat-label">Total Earnings</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalReferrals">0</div>
                    <div class="stat-label">Friends Invited</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load Referral Data
        document.addEventListener('DOMContentLoaded', function () {
            // Generate/Get Code
            fetch('referral_system.php?action=generate_code')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('myReferralCode').textContent = data.code;
                        updateShareLinks(data.code);
                    }
                });

            // Get Earnings
            fetch('referral_system.php?action=get_earnings')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('totalEarnings').textContent = '₹' + data.earnings;
                    document.getElementById('totalReferrals').textContent = data.referrals;
                });
        });

        function copyCode() {
            const code = document.getElementById('myReferralCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.copy-btn');
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                btn.style.background = '#4CAF50';
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.style.background = '#1976D2';
                }, 2000);
            });
        }

        function updateShareLinks(code) {
            const text = `Join me on PaySecure and get ₹50! Use my code: ${code}`;
            const url = window.location.origin + '/online_payment/account/signup.php?ref=' + code;

            document.getElementById('shareWhatsapp').href = `https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`;
            document.getElementById('shareTelegram').href = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
            document.getElementById('shareEmail').href = `mailto:?subject=Join PaySecure&body=${encodeURIComponent(text + ' ' + url)}`;
        }
    </script>
</body>

</html>
